<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTubeメドレー</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; margin: 0; padding: 16px; background: #111; color: #eee; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  #wrap { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16 / 9; background: #000; }
  #player { position: absolute; inset: 0; width: 100%; height: 100%; }
  .controls { margin: 12px 0; display: flex; gap: 8px; }
  button { font-size: 16px; padding: 10px 16px; border: none; border-radius: 8px; background: #e53935; color: #fff; }
  button.sub { background: #444; }
  ol { padding-left: 24px; max-width: 800px; }
  li { padding: 8px; border-radius: 6px; cursor: pointer; }
  li.now { background: #333; font-weight: bold; }
  .note { font-size: 12px; color: #999; }
</style>
</head>
<body>
<h1>YouTubeメドレー</h1>
<div id="wrap"><div id="player"></div></div>
<div class="controls">
  <button id="startBtn">▶ 最初から再生</button>
  <button class="sub" id="prevBtn">⏮ 前へ</button>
  <button class="sub" id="nextBtn">次へ ⏭</button>
</div>
<ol id="list"></ol>
<p class="note">曲を追加・変更するときは、このファイルの SEGMENTS を編集してください（時間は「分:秒」）。</p>

<script>
// ===== ここを編集すると曲・区間を変えられます =====
const SEGMENTS = [
  { id: "7zBeQezaz4U", start: "0:00", end: "2:07" },
  { id: "pvqvBAA-0AE", start: "0:10", end: "2:11" },
  { id: "pvqvBAA-0AE", start: "3:19", end: "4:21" },
  { id: "yXQViqx6GMY", start: "0:00", end: "" },   // end を空にすると最後まで再生
];
// =================================================

const toSec = t => t.split(":").reduce((a, v) => a * 60 + Number(v), 0);
const segs = SEGMENTS.map(s => ({ ...s, s: toSec(s.start || "0"), e: s.end ? toSec(s.end) : undefined }));
const opts = s => { const o = { videoId: s.id, startSeconds: s.s }; if (s.e !== undefined) o.endSeconds = s.e; return o; };
let player, idx = 0, ready = false, advancing = false;

const list = document.getElementById("list");
segs.forEach((s, i) => {
  const li = document.createElement("li");
  li.textContent = `${s.id}（${s.start} 〜 ${s.end || "最後まで"}）`;
  li.onclick = () => play(i);
  list.appendChild(li);
});
function mark() {
  [...list.children].forEach((li, i) => li.classList.toggle("now", i === idx));
}

const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player("player", {
    width: "100%", height: "100%",
    playerVars: { playsinline: 1, rel: 0, origin: location.origin },
    events: {
      onReady: () => {
        ready = true;
        player.cueVideoById(opts(segs[0]));
        mark();
      },
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) next(); },
      onError: () => next(),
    },
  });
};

function play(i) {
  if (!ready || i < 0 || i >= segs.length) return;
  idx = i; advancing = false;
  const s = segs[i];
  player.loadVideoById(opts(s));
  mark();
}
function next() {
  if (advancing) return;
  advancing = true;
  if (idx + 1 < segs.length) play(idx + 1);
  else { idx = 0; mark(); advancing = false; }
}

// 念のため：終了時刻を過ぎたら次へ（同じ動画の別区間でも確実に切り替える）
setInterval(() => {
  if (!ready || !player.getCurrentTime) return;
  const s = segs[idx];
  if (s.e === undefined) return;
  if (player.getPlayerState() === YT.PlayerState.PLAYING && player.getCurrentTime() >= s.e - 0.2) next();
}, 250);

document.getElementById("startBtn").onclick = () => play(0);
document.getElementById("prevBtn").onclick = () => play(Math.max(0, idx - 1));
document.getElementById("nextBtn").onclick = () => play(idx + 1);
</script>
</body>
